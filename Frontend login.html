<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login | All Area Shop</title>
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--ink:#2b231c;--muted:#7a6c5f;--line:#ddd2c4;--brass:#c39458;--walnut:#5a3f2b;--err:#a23b2c;--ease:cubic-bezier(.2,.72,.2,1);--ih:clamp(36px,5.6vh,46px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2019}
body{height:100dvh;display:grid;place-items:center;overflow:hidden;padding:max(12px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:var(--ink)}
[hidden]{display:none!important}

/* Scene */
.scene{position:fixed;inset:-4%;z-index:-4;background:linear-gradient(90deg,rgba(18,13,9,.7),rgba(36,26,18,.15) 55%,rgba(18,13,9,.45)),url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2200&q=90') center/cover #3a2d22;translate:var(--px,0) var(--py,0);transition:translate .7s var(--ease);animation:settle 14s ease-out both}
.rays{position:fixed;inset:-30%;z-index:-3;pointer-events:none;opacity:0;mix-blend-mode:screen;filter:blur(22px);background:repeating-linear-gradient(112deg,transparent 0 9%,rgba(255,222,165,.16) 11% 14%,transparent 16% 26%);animation:fadein 2.4s ease 1.6s forwards,sway 16s ease-in-out 3s infinite alternate}
.bloom{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:0;background:radial-gradient(circle at 62% 45%,rgba(255,234,196,.95),rgba(255,214,150,.35) 35%,transparent 65%);animation:bloom 2.4s ease 1.4s both}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 55% 45%,transparent 38%,rgba(10,6,3,.62))}
.dust{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.dust i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff0c8;filter:blur(var(--b));box-shadow:0 0 12px 3px rgba(255,226,167,.55);opacity:0;animation:drift var(--d) ease-in-out var(--l) infinite}

/* Shutters */
.shutters{position:fixed;z-index:9999;inset:0;display:grid;grid-template-columns:1fr 1fr;perspective:1800px;pointer-events:none;overflow:hidden;transition:opacity .6s ease 2.1s}
.shutter{position:relative;transform-style:preserve-3d;transition:transform 2.4s cubic-bezier(.6,0,.15,1.04),filter 2.2s ease;background:repeating-linear-gradient(180deg,rgba(255,226,186,.24) 0 2px,rgba(0,0,0,.42) 2px 4px,transparent 4px 30px),linear-gradient(100deg,#4b3424,#7a5a3d 45%,#946f49 55%,#5f4430);box-shadow:inset 0 0 70px rgba(20,12,6,.55)}
.shutter:first-child{transform-origin:left center;border-right:8px solid #3b281b}
.shutter:last-child{transform-origin:right center;border-left:8px solid #3b281b}
.shutter:after{content:"";position:absolute;top:50%;width:12px;height:44px;border-radius:6px;background:linear-gradient(90deg,#f1d79c,#b88a45);box-shadow:0 2px 6px #1d1209}
.shutter:first-child:after{right:16px}.shutter:last-child:after{left:16px}
.shutters.is-open{opacity:0}
.shutters.is-open .shutter:first-child{transform:rotateY(-106deg);filter:brightness(.65)}
.shutters.is-open .shutter:last-child{transform:rotateY(106deg);filter:brightness(.65)}

/* Layout: one screen, hero left + card right */
.brand{position:fixed;z-index:3;top:22px;left:clamp(16px,4vw,48px);display:flex;align-items:center;gap:10px;color:#fff8eb;font-weight:700;font-size:14px;letter-spacing:.04em;text-shadow:0 2px 14px #1c120a;opacity:0;animation:rise .7s ease 1.3s forwards}
.brand b{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(255,248,235,.75);border-radius:50%;font:20px Georgia,serif;letter-spacing:0;background:rgba(255,255,255,.08)}
.stage{display:grid;grid-template-columns:1fr minmax(0,480px);gap:clamp(28px,8vw,130px);align-items:center;width:min(1120px,100%);padding:0 clamp(16px,4vw,48px)}
.hero{color:#fffaf0;text-shadow:0 3px 26px rgba(15,10,6,.75)}
h1{margin:0 0 10px;font:500 clamp(46px,8vw,92px)/.98 Georgia,'Times New Roman',serif;letter-spacing:-.045em;animation:wipe 1.3s var(--ease) 1.5s both}
.sub{max-width:26ch;margin:0 0 26px;font-size:clamp(15px,2.2vh,19px);line-height:1.5;color:#fff0dc;animation:rise .8s var(--ease) 1.9s both}
.login-home{display:inline-block;padding:11px 18px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(36,27,20,.4);color:#fff7eb;font-size:13px;font-weight:700;text-decoration:none;text-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,transform .2s;animation:rise .6s ease 2.2s both}
.login-home:hover{background:rgba(36,27,20,.7);transform:translateX(-3px)}
.login-home .short{display:none}

/* Card */
form{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.4vh,12px) 14px;padding:clamp(18px,3.4vh,32px) clamp(20px,3vw,30px);border-radius:26px;background:rgba(252,249,243,.9);box-shadow:0 40px 100px rgba(10,6,3,.55),0 1px 0 #fff inset;-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);animation:card 1.1s var(--ease) 1.8s both}
form:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--a),rgba(255,255,255,.9),rgba(255,255,255,.1) 25%,#e6b574 50%,rgba(255,255,255,.1) 75%,rgba(255,255,255,.9));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite}
form:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,206,140,.3),transparent 70%)}
.f{display:grid;gap:4px;align-content:start;min-width:0;animation:rise .6s var(--ease) both;animation-delay:calc(2.1s + var(--i)*.08s)}
.f.full,#login-submit,.auth-mode{grid-column:1/-1}
.f:has(>input[hidden]){display:none}
label{color:#4d4136;font-size:12px;font-weight:700;transition:color .2s}
.f:focus-within label{color:var(--walnut)}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=file]{display:block;width:100%;height:var(--ih);padding:0 13px;border:1px solid var(--line);border-radius:11px;background:#fffefb;color:var(--ink);font:16px 'Trebuchet MS',Arial,sans-serif;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:#a99b8d}
input:hover{border-color:#cdbca6}
input:focus{outline:none;border-color:var(--brass);background:#fff;box-shadow:0 0 0 4px rgba(195,148,88,.2)}
input[type=file]{padding:0 6px;font-size:12px;color:var(--muted);line-height:calc(var(--ih) - 2px)}
input[type=file]::file-selector-button{margin-right:10px;padding:6px 12px;border:0;border-radius:7px;background:#efe4d4;color:#4a382a;font:700 12px 'Trebuchet MS',Arial,sans-serif;cursor:pointer;transition:background .2s}
input[type=file]::file-selector-button:hover{background:#e6d5bd}
.row{display:flex;align-items:center;gap:10px}
#photo-preview{flex:none;width:calc(var(--ih) + 2px);height:calc(var(--ih) + 2px);object-fit:cover;border:3px solid #fff;border-radius:50%;box-shadow:0 5px 14px rgba(58,43,31,.28);animation:pop .4s var(--ease) both}
.pw{position:relative}.pw input{padding-right:60px}
.pw button{position:absolute;top:50%;right:5px;translate:0 -50%;height:calc(var(--ih) - 10px);padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--walnut);font:700 12px 'Trebuchet MS',Arial,sans-serif;cursor:pointer;transition:background .2s}
.pw button:hover{background:#f1e8db}
form span{color:var(--err);font-size:11px;animation:rise .25s ease both}
form span:empty{display:none}
#login-submit{height:calc(var(--ih) + 6px);margin-top:4px;border:0;border-radius:11px;color:#fffaf2;font:700 16px 'Trebuchet MS',Arial,sans-serif;letter-spacing:.03em;cursor:pointer;background:linear-gradient(110deg,#5a3f2b 0 38%,#9a7249 50%,#5a3f2b 62%) 100% 0/260% 100%;box-shadow:0 12px 24px rgba(70,45,26,.32);transition:background-position .7s ease,transform .2s,box-shadow .2s;animation:rise .6s var(--ease) 2.7s both}
#login-submit:hover{background-position:0 0;transform:translateY(-2px);box-shadow:0 16px 30px rgba(70,45,26,.38)}
#login-submit:active{transform:none}
.auth-mode{padding:6px;border:0;border-radius:10px;background:transparent;color:var(--walnut);font:700 13px 'Trebuchet MS',Arial,sans-serif;cursor:pointer;transition:background .2s;animation:rise .6s ease 2.8s both}
.auth-mode:hover{background:rgba(90,63,43,.08)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}input:focus-visible{outline:none}
.replay{position:fixed;z-index:10001;right:clamp(12px,3vw,32px);bottom:10px;padding:7px 12px;border:1px solid rgba(255,248,235,.4);border-radius:999px;background:rgba(36,27,20,.4);color:#fff8eb;font:12px 'Trebuchet MS',sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.replay:hover{background:rgba(36,27,20,.7)}

@keyframes settle{from{transform:scale(1.14);filter:brightness(.35) saturate(.6)}12%{filter:brightness(.82) saturate(.92)}to{transform:scale(1.02);filter:brightness(.82) saturate(.92)}}
@keyframes fadein{to{opacity:1}}
@keyframes sway{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@keyframes bloom{0%{opacity:0;transform:scale(.6)}30%{opacity:.75}100%{opacity:0;transform:scale(1.7)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-18px)}to{opacity:1;clip-path:inset(-10% -5% -10% -5%);transform:none}}
@keyframes card{from{opacity:0;transform:translateX(60px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{--a:360deg}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes drift{0%{transform:translate3d(0,14px,0);opacity:0}25%{opacity:.8}75%{opacity:.35}100%{transform:translate3d(var(--dx),-110px,0);opacity:0}}

@media(max-width:860px){
  .brand{display:none}
  .stage{grid-template-columns:1fr;gap:clamp(8px,2vh,18px);justify-items:center}
  .hero{text-align:center}
  h1{font-size:clamp(30px,5.4vh,44px);margin-bottom:4px}
  .sub{max-width:none;margin:0;font-size:clamp(12px,1.8vh,14px)}
  form{width:min(100%,440px)}
  .login-home{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));right:12px;padding:8px 13px;font-size:12px}
  .login-home .long{display:none}.login-home .short{display:inline}
  .replay{display:none}
}
@media(max-width:430px){form{grid-template-columns:1fr}.f.half{grid-column:1/-1}}
@media(max-height:560px){body{overflow-y:auto;height:auto;min-height:100dvh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.shutters,.bloom{display:none}.brand,.rays{opacity:1}}
</style>
<link rel="icon" href="../logo.png">
<style id="logo-tile">
.brand{display:none!important}
.hero-logo{display:inline-flex;margin-bottom:clamp(12px,2.6vh,24px);padding:clamp(8px,1.4vh,14px) clamp(14px,2vw,22px);border:1px solid rgba(255,255,255,.65);border-radius:20px;background:linear-gradient(160deg,#fffaf3,#f1e6d8);box-shadow:0 18px 40px rgba(10,6,3,.4),inset 0 1px #fff;text-shadow:none;animation:logo-in 1s var(--ease) 1.25s both}
.hero-logo img{display:block;height:clamp(54px,11vh,104px);width:auto}
@keyframes logo-in{from{opacity:0;transform:translateY(-16px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
@media(max-width:860px){.hero-logo img{height:clamp(34px,6.4vh,58px)}.hero-logo{border-radius:16px;margin-bottom:clamp(6px,1.4vh,12px)}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div><div class="rays" aria-hidden="true"></div><div class="bloom" id="bloom" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
<div class="brand" aria-hidden="true"><b>A</b>All Area Shop</div>
<div class="dust" id="motion-dust" aria-hidden="true"></div>
<button type="button" class="replay" id="motion-replay">↻ Replay reveal</button>
<div class="shutters" id="window-shutters" aria-hidden="true"><div class="shutter"></div><div class="shutter"></div></div>

<main class="stage">
  <div class="hero">
    <span class="hero-logo"><img src="../logo.png" alt="" width="708" height="452"></span><br>
    <h1>All Area Shop</h1>
    <p class="sub">Sign in to save your profile details</p>
    <a class="login-home" href="https://aashop-seven.vercel.app">← <span class="long">Back to the shop</span><span class="short">Shop</span></a>
  </div>
  <form id="login-form">
    <div class="f half" style="--i:0">
      <label for="na" id="name-label">Name</label>
      <input type="text" id="na" placeholder="Your name" autocomplete="name">
      <span id="s1"></span>
    </div>
    <div class="f half" style="--i:1">
      <label for="nu" id="phone-label">Number</label>
      <input type="tel" id="nu" inputmode="numeric" autocomplete="tel" placeholder="Your number">
      <span id="s2"></span>
    </div>
    <div class="f half" style="--i:2">
      <label for="ma">E-mail</label>
      <input type="email" id="ma" placeholder="Your e-mail" autocomplete="email">
      <span id="s3"></span>
    </div>
    <div class="f half" style="--i:3">
      <label for="password" id="password-label">Password</label>
      <div class="pw">
        <input type="password" id="password" minlength="6" autocomplete="current-password" placeholder="6+ characters">
        <button type="button" id="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <span id="s4" role="status" aria-live="polite"></span>
    </div>
    <div class="f full" style="--i:4">
      <label for="photo" id="photo-label">Profile photo</label>
      <div class="row">
        <input type="file" id="photo" accept="image/*">
        <img id="photo-preview" alt="Profile photo preview" hidden>
      </div>
    </div>
    <input type="submit" id="login-submit" value="Sign in">
    <button type="button" id="auth-mode" class="auth-mode">New here? Create an account</button>
  </form>
</main>

<script>
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const dust = document.getElementById('motion-dust');
for (let i = 0; i < 26; i++) {
  const m = document.createElement('i'), r = Math.random, big = r() > .7;
  m.style.cssText = `--x:${8+r()*84}%;--y:${25+r()*65}%;--s:${big?5+r()*4:2+r()*3}px;--b:${big?2:0}px;--d:${5+r()*9}s;--l:${r()*-12}s;--dx:${-34+r()*68}px`;
  dust.appendChild(m);
}
const shutters = document.getElementById('window-shutters'), bloom = document.getElementById('bloom');
const open = () => shutters.classList.add('is-open');
if (!reduced) setTimeout(open, 800);
document.getElementById('motion-replay').addEventListener('click', () => {
  shutters.classList.remove('is-open'); shutters.style.transition = 'none'; shutters.style.opacity = '1';
  bloom.style.animation = 'none'; void shutters.offsetWidth;
  shutters.style.transition = ''; bloom.style.animation = 'bloom 2.4s ease .9s both';
  setTimeout(open, 80);
});
const form = document.getElementById('login-form');
if (!reduced) addEventListener('pointermove', e => {
  const s = document.documentElement.style;
  s.setProperty('--px', ((e.clientX / innerWidth - .5) * -20) + 'px');
  s.setProperty('--py', ((e.clientY / innerHeight - .5) * -14) + 'px');
  const b = form.getBoundingClientRect();
  form.style.setProperty('--mx', (e.clientX - b.left) + 'px');
  form.style.setProperty('--my', (e.clientY - b.top) + 'px');
});
const pw = document.getElementById('password'), tg = document.getElementById('pw-toggle');
tg.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  tg.textContent = show ? 'Hide' : 'Show';
  tg.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});
window.profilePhotoData = '';
document.getElementById('photo').addEventListener('change', event => {
  const file = event.target.files?.[0];
  const preview = document.getElementById('photo-preview');
  if (!file) { window.profilePhotoData = ''; preview.hidden = true; return; }
  if (!file.type.startsWith('image/')) { event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 320 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      window.profilePhotoData = canvas.toDataURL('image/jpeg', 0.78);
      preview.src = window.profilePhotoData; preview.hidden = false;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
</script>
<script>
(() => {
  const form = document.querySelector('form');
  const profileKey = 'allAreaShopProfile';
  let existing = null;
  try { existing = JSON.parse(localStorage.getItem(profileKey) || 'null'); } catch {}
  const edit = new URLSearchParams(location.search).has('edit');
  if (existing && !edit) location.replace('../index.html#profile');
  const fields = form ? [...form.querySelectorAll('input:not([type=submit]):not([type=file]), select')] : [];
  const ids = {name:'na', phone:'nu', email:'ma'};
  const byName = key => document.getElementById(ids[key]) || fields.find(el => (el.name||'').toLowerCase().includes(key) || (el.id||'').toLowerCase().includes(key));
  if (edit && existing) { for (const key of ['name','phone','email','gender']) { const field=byName(key); if(field) field.value=existing[key]||''; } }
  form?.addEventListener('submit', event => {
    event.preventDefault();
    const value = name => byName(name)?.value?.trim() || '';
    const profile = {name:value('name'), phone:value('phone'), email:value('email'), gender:value('gender'), photo:existing?.photo||''};
    const file = form.querySelector('input[type=file]');
    const save = () => { try { localStorage.setItem(profileKey, JSON.stringify(profile)); location.href='../index.html#profile'; } catch { alert('Could not save details in this browser.'); } };
    if(file?.files?.[0]) { const reader=new FileReader(); reader.onload=()=>{profile.photo=reader.result;save();}; reader.readAsDataURL(file.files[0]); } else save();
  });
})();
</script>
</body>
</html>
