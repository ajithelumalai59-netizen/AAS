  <div class="window-shutters" id="window-shutters" aria-hidden="true"><div class="window-shutter"></div><div class="window-shutter"></div></div>

    <form onsubmit= "return submitForm()">
        <label for="na">Name:  </label>
        <input type="text" id="na" placeholder="Enter your Name"><br>

        <input type="submit">
    
    </form>

    </table>
    
    <script>
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAr2eo8Zr68FxTRRHf82N95eI3C_gV7YCQ",
  authDomain: "aa-shop-5811f.firebaseapp.com",
  projectId: "aa-shop-5811f",
  storageBucket: "aa-shop-5811f.firebasestorage.app",
  messagingSenderId: "174463369993",
  appId: "1:174463369993:web:6b0151ba2506a0cbefc9d8"
};

export const app = initializeApp(firebaseConfig);
export const auth = getAuth(app);
export const db = getFirestore(app);

export async function readCart(user) {
  const snapshot = await getDocs(collection(db, "users", user.uid, "cartItems"));
  return snapshot.docs.map(item => ({ id: item.data().productId || item.id, ...item.data() }));
}

export async function writeCart(user, items) {
  const cartRef = collection(db, "users", user.uid, "cartItems");
  const existing = await getDocs(cartRef);
  const wanted = new Set(items.map(item => String(item.id)));
  const batch = writeBatch(db);
  existing.docs.forEach(item => {
    if (!wanted.has(item.data().productId || item.id)) batch.delete(item.ref);
  });
  items.forEach(item => {
    const productId = String(item.id);
    batch.set(doc(cartRef, encodeURIComponent(productId)), {
      productId,
      name: String(item.name || ""),
      price: Number(item.price) || 0,
      image: String(item.image || ""),
      quantity: Math.max(1, Math.min(99, Math.floor(Number(item.quantity) || 1)))
    });
  });
  await batch.commit();
}
            // Add soft dust motes and let visitors replay the shutter reveal.
      const motionDust = document.getElementById('motion-dust');
      for (let i = 0; i < 24; i++) {
        const mote = document.createElement('i');
        mote.style.setProperty('--x', `${10 + Math.random() * 80}%`);
        mote.style.setProperty('--y', `${25 + Math.random() * 65}%`);
        mote.style.setProperty('--size', `${2 + Math.random() * 3}px`);
        mote.style.setProperty('--duration', `${5 + Math.random() * 8}s`);
        mote.style.setProperty('--delay', `${Math.random() * -12}s`);
        mote.style.setProperty('--drift', `${-28 + Math.random() * 56}px`);
        motionDust.appendChild(mote);
      }
      const replayReveal = () => {
        const shutters = document.getElementById('window-shutters');
        shutters.classList.remove('is-open');
        shutters.style.opacity = '1';
        window.setTimeout(() => shutters.classList.add('is-open'), 80);
      };
      document.getElementById('motion-replay').addEventListener('click', replayReveal);
      // Open the wooden shutters shortly after the page appears.
      const windowShutters = document.getElementById('window-shutters');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.setTimeout(() => windowShutters.classList.add('is-open'), 900);
      }
      let profilePhotoData = '';
      document.getElementById('photo').addEventListener('change', event => {
        const file = event.target.files?.[0];
        const preview = document.getElementById('photo-preview');
        if (!file) { profilePhotoData = ''; preview.hidden = true; return; }
        if (!file.type.startsWith('image/')) { event.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 320 / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            profilePhotoData = canvas.toDataURL('image/jpeg', 0.78);
            preview.src = profilePhotoData; preview.hidden = false;
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      function submitForm(){
        const name=document.getElementById('na').value.trim(), phone=document.getElementById('nu').value.trim(), email=document.getElementById('ma').value.trim();
        document.getElementById('s1').textContent=name?'':'Please enter your name';
        document.getElementById('s2').textContent=phone&&/^\d{7,15}$/.test(phone)?'':'Enter a valid phone number';
        document.getElementById('s3').textContent=email?'':'Please enter your email';
        if(!name||!phone||!/^\d{7,15}$/.test(phone)||!email)return false;
        const profile={name,phone,email,photo:profilePhotoData};
        try{localStorage.setItem('allAreaShopProfile',JSON.stringify(profile));}catch(error){}
        const handoff=new URLSearchParams({name,phone,email,photo:profilePhotoData}).toString();
        window.location.href=`profile.html#profile?${handoff}`;
        return false;
      }
    </script>
