<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Cart | All Area Shop</title>
    <style>
      :root {
        --ink: #28241f;
        --muted: #777168;
        --navy: #35445b;
        --line: #e8e3da;
        --paper: #f7f5f0;
        --card: #fffdfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 Arial,
          sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px clamp(20px, 5vw, 72px);
        border-bottom: 1px solid #41392f19;
        background: #fffdfae0;
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--navy);
        text-decoration: none;
        font:
          28px Georgia,
          serif;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: white;
        color: var(--navy);
        font:
          bold 13px/1 Georgia,
          serif;
      }
      .back {
        color: var(--navy);
        font-weight: 700;
        text-decoration: none;
      }
      .mini-nav {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mini-nav a {
        white-space: nowrap;
      }
      .mini-nav a {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--navy);
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
      }
      .mini-nav svg {
        width: 15px;
        height: 15px;
      }
      .mini-avatar {
        width: 24px;
        height: 24px;
        border: 1px solid #fff;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 2px 8px #26354b22;
      }
      .mini-avatar[hidden] {
        display: none;
      }
      .page {
        width: min(1040px, 100%);
        min-height: 75vh;
        margin: auto;
        padding: clamp(48px, 7vw, 82px) clamp(20px, 5vw, 72px) 90px;
      }
      .eyebrow {
        color: #a9533d;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      h1 {
        margin: 12px 0;
        color: var(--ink);
        font:
          500 clamp(36px, 5vw, 56px)/1.05 Georgia,
          serif;
        letter-spacing: -0.04em;
      }
      .intro {
        margin: 0 0 30px;
        color: var(--muted);
      }
      .card {
        max-width: 760px;
        padding: clamp(22px, 4vw, 38px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 8px 24px #25221c0d;
      }
      .identity {
        display: flex;
        align-items: flex-start;
        gap: 22px;
      }
      .avatar {
        width: 112px;
        height: 112px;
        flex: none;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 5px 18px #242d3c26;
      }
      .avatar[hidden] {
        display: none;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        flex: 1;
      }
      .field {
        padding: 15px;
        border-radius: 10px;
        background: #f5f2ec;
        overflow-wrap: anywhere;
      }
      .field span {
        display: block;
        margin-bottom: 7px;
        color: #8b8174;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .field strong {
        color: var(--navy);
        font-size: 15px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      .actions a,
      .actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 17px;
        border: 0;
        border-radius: 9px;
        background: var(--navy);
        color: white;
        text-decoration: none;
        font:
          600 14px Arial,
          sans-serif;
        cursor: pointer;
      }
      .actions .secondary {
        background: #ebe7df;
        color: var(--navy);
      }
      .empty {
        padding: 26px;
        border: 1px dashed #d6cdc2;
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
      }
      footer {
        padding: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 620px) {
        .identity {
          flex-direction: column;
          align-items: center;
        }
        .fields {
          width: 100%;
          grid-template-columns: 1fr;
        }
        .brand {
          font-size: 24px;
        }
      }
      .mini-nav a {
        position: relative;
        perspective: 500px;
        transition:
          transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
          color 0.25s ease;
      }
      .mini-nav a svg,
      .mini-nav a img {
        transition:
          transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
          filter 0.3s ease;
      }
      .mini-nav a:focus-visible {
        outline: 2px solid #a96b4f;
        outline-offset: 4px;
        border-radius: 8px;
      }
      @media (hover: hover) {
        .mini-nav a:hover {
          transform: translateY(-2px) rotateX(4deg);
          color: #a9533d;
        }
        .mini-nav a:hover svg,
        .mini-nav a:hover img {
          transform: translateZ(7px) scale(1.1);
          filter: drop-shadow(0 3px 3px rgba(38, 49, 65, 0.2));
        }
        .mini-nav a:active {
          transform: translateY(0) scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mini-nav a,
        .mini-nav a svg,
        .mini-nav a img {
          transition: none !important;
          transform: none !important;
        }
      }
      /* Match the warm taupe glass navbar palette */
      .topbar {
        background: rgba(184, 160, 149, 0.9);
        border-bottom-color: rgba(82, 62, 52, 0.16);
        box-shadow: 0 8px 24px rgba(77, 57, 48, 0.12);
      }
      .brand,
      .mini-nav a {
        color: #493831;
      }
      .mini-nav a:hover {
        color: #754e3d;
      }
      .mark {
        color: #493831;
        background: rgba(255, 253, 250, 0.88);
        box-shadow: 0 4px 14px rgba(77, 57, 48, 0.12);
      }
      .mark {
        background: rgba(184, 160, 149, 0.88);
        box-shadow: 0 3px 12px rgba(77, 57, 48, 0.16);
      }
      .topbar {
        background: rgba(184, 160, 149, 0.9);
      }
      /* Match the shop's premium espresso and ivory glass navbar */
      .topbar {
        background: rgba(48, 40, 36, 0.94);
        border-bottom-color: rgba(238, 213, 190, 0.22);
        box-shadow: 0 10px 28px rgba(34, 27, 23, 0.2);
      }
      .brand,
      .mini-nav a {
        color: #fff4e8;
      }
      .brand:hover,
      .mini-nav a:hover {
        color: #e2bd91;
      }
      .mark {
        background: rgba(250, 240, 229, 0.94);
        color: #46342a;
        box-shadow: 0 3px 14px rgba(20, 16, 14, 0.2);
      }
      .mini-nav a:focus-visible {
        outline-color: #e2bd91;
      }
      /* Keep profile navbar interaction flat: 2D feedback only */
      .mini-nav a {
        perspective: none !important;
      }
      .mini-nav a:hover {
        transform: translateY(-1px) !important;
      }
      .mini-nav a:hover svg,
      .mini-nav a:hover img {
        transform: scale(1.06) !important;
      }
      .mini-nav a:active {
        transform: scale(0.98) !important;
      }
      /* Preserve navbar colors during hover and click */
      .mini-nav a:hover,
      .mini-nav a:focus-visible,
      .mini-nav a:active {
        color: #fff4e8 !important;
      }
      .mini-nav #nav-user {
        display: none !important;
      }
    /* Phone-first account page layout */
:root{--ink:#302824;--muted:#74675f;--navy:#59483f;--line:#e3d8ce;--paper:#f3eee8;--card:#fffdf9}
html,body{background:var(--paper)}
.topbar{background:rgba(63,51,45,.96)!important;border-bottom-color:rgba(239,221,207,.24)!important;backdrop-filter:blur(18px)}
.brand,.mini-nav a{color:#fff6ee!important}.mark{background:#e8d9ce!important;color:#59483f!important}
.page{color:var(--ink)}.card{background:var(--card);border-color:var(--line)}
.field{background:#f7f2ed!important}.field strong{color:#59483f!important}
.actions a,.actions button{background:#59483f!important;color:#fffaf5!important}
@media(max-width:600px){
  .topbar{position:sticky;top:0;z-index:20;flex-wrap:wrap;justify-content:center;gap:9px;padding:9px 12px}
  .brand{justify-content:center;gap:8px;font-size:clamp(21px,6vw,25px)!important}
  .mark{width:34px;height:34px;font-size:12px!important}
  .mini-nav{width:100%;max-width:100%;justify-content:flex-start;gap:4px;overflow-x:auto;padding:5px;border:1px solid rgba(255,245,235,.2);border-radius:12px;background:rgba(255,245,235,.1);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .mini-nav::-webkit-scrollbar{display:none}
  .mini-nav a{flex:0 0 auto;min-height:36px;padding:0 11px;border-radius:9px;font-size:11px!important}
  .mini-nav a:hover,.mini-nav a:focus-visible{background:rgba(255,241,225,.16)}
  .page{width:100%;min-height:calc(100svh - 100px);padding:34px 14px 48px}
  h1{font-size:clamp(34px,10vw,44px)!important;line-height:1.04}
  .intro{margin-bottom:20px;font-size:14px;line-height:1.6}
  .card{width:100%;padding:18px;border-radius:15px}
  .identity{gap:16px}
  .avatar{width:88px;height:88px}
  .fields{grid-template-columns:1fr!important;gap:9px}
  .field{padding:13px;border-radius:10px}
  .field strong{font-size:14px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
  .actions a,.actions button{min-height:46px;padding-inline:10px}
  .empty{padding:20px 14px;line-height:1.6}
  footer{padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){.mini-nav a{padding-inline:9px;font-size:10px!important}.actions{grid-template-columns:1fr}}
/* Cart page layout */
.cart-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.75fr);gap:22px;align-items:start}
.cart-items{display:grid;gap:11px;min-width:0}
.cart-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 14px rgba(63,51,45,.05)}
.cart-row img{width:76px;height:72px;grid-row:span 2;border-radius:10px;object-fit:cover;background:#eee6df}
.cart-row h3{margin:0 0 4px;color:var(--ink);font:500 17px/1.25 Georgia,serif}
.cart-row p{margin:0;color:var(--muted);font-size:13px}
.cart-row-total{grid-column:3;grid-row:1/3;white-space:nowrap;color:#59483f;font-size:15px}
.cart-controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.cart-controls button,.cart-controls input{min-width:36px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;color:var(--ink);font:600 14px Arial,sans-serif}
.cart-controls button{cursor:pointer}.cart-controls button:hover{background:#f0e5dc}.cart-controls input{width:44px;text-align:center}
.cart-controls .cart-remove{padding:0 10px;color:#98634e}
.cart-summary{position:sticky;top:90px;padding:20px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 8px 24px rgba(63,51,45,.06)}
.cart-summary h2{margin:0 0 14px;color:var(--ink);font:500 22px Georgia,serif}
.cart-summary p{display:flex;justify-content:space-between;gap:12px;margin:0;padding:12px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.cart-summary p strong{color:var(--ink)}
.cart-summary .continue-shopping{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:17px;padding:8px 14px;border-radius:9px;background:#59483f;color:#fffaf5;text-align:center;text-decoration:none;font-weight:700;transition:background .2s ease,transform .2s ease}
.cart-summary .continue-shopping:hover{transform:translateY(-1px);background:#765744}
.cart-empty{padding:24px 18px;border:1px dashed #d6c9bd;border-radius:13px;background:rgba(255,253,249,.7);color:var(--muted);text-align:center;line-height:1.65}
@media(max-width:700px){.cart-layout{grid-template-columns:1fr;gap:14px}.cart-summary{position:static;order:-1}.cart-summary h2{font-size:20px}.cart-row{grid-template-columns:62px minmax(0,1fr);gap:9px;padding:10px}.cart-row img{width:62px;height:66px}.cart-row h3{font-size:15px}.cart-row-total{grid-column:2;grid-row:auto;justify-self:start;font-size:14px}.cart-controls button,.cart-controls input{min-width:40px;min-height:40px}.cart-controls input{width:48px}.cart-page{padding-top:30px}}
@media(max-width:360px){.cart-row{grid-template-columns:54px minmax(0,1fr);gap:8px}.cart-row img{width:54px;height:60px}.cart-controls{gap:5px}.cart-controls button,.cart-controls input{min-width:36px;min-height:38px}}
@media(prefers-reduced-motion:reduce){.cart-summary .continue-shopping{transition:none}}
</style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://aashop-c1pql70il-ajith735897-1974.vercel.app/"
        ><span class="mark">A A<br />A S</span><span>All Area Shop</span></a
      >
      <nav class="mini-nav" aria-label="Shop navigation">
        <a href="https://aashop-c1pql70il-ajith735897-1974.vercel.app/"
          ><svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="https://aashop-c1pql70il-ajith735897-1974.vercel.app/" /></svg
          >Home</a
        ><a href="https://aashop-5yo8h7oct-ajith735897-1974.vercel.app/#products">Products</a
        ><a href="cart.html">Cart</a
        ><a href="profile.html" aria-label="Your profile"
          ><img class="mini-avatar" id="nav-photo" alt="" hidden /><svg
            id="nav-user"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" /></svg
          >Profile</a
        >
      </nav>
    </header>
    <main class="page cart-page">
  <span class="eyebrow">YOUR SELECTION</span>
  <h1>Shopping cart</h1>
  <p class="intro">Review your items and adjust quantities before you continue shopping.</p>
  <div class="cart-layout">
    <section class="cart-items" id="cart-items" aria-label="Items in your cart" aria-live="polite"></section>
    <aside class="cart-summary" aria-label="Order summary">
      <h2>Order summary</h2>
      <p><span>Items</span><strong id="cart-summary-count">0</strong></p>
      <p class="summary-total"><span>Subtotal</span><strong id="cart-subtotal">₹0</strong></p>
      <a class="continue-shopping" href="AA_shop_responsive_media_queries.html#products">Continue shopping</a>
    </aside>
  </div>
</main>
    <footer>All Area Shop · Thoughtful finds for every corner.</footer>
    <script>
(() => {
  const storageKey = 'all-area-shop-cart-v1';
  const list = document.getElementById('cart-items');
  const itemCount = document.getElementById('cart-summary-count');
  const subtotal = document.getElementById('cart-subtotal');
  const escapeText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const money = value => `₹${Number(value || 0).toLocaleString('en-IN', {maximumFractionDigits:2})}`;
  let cart = [];
  try { const saved = JSON.parse(localStorage.getItem(storageKey) || '[]'); if (Array.isArray(saved)) cart = saved; } catch {}
  const save = () => { try { localStorage.setItem(storageKey, JSON.stringify(cart)); } catch {} };
  const render = () => {
    const count = cart.reduce((sum, item) => sum + Math.max(0, Number(item.quantity) || 0), 0);
    const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.quantity) || 0), 0);
    itemCount.textContent = count;
    subtotal.textContent = money(total);
    if (!cart.length) { list.innerHTML = '<div class="cart-empty"><strong>Your cart is empty.</strong><br>Choose a product and add it to your cart to see it here.</div>'; return; }
    list.innerHTML = cart.map(item => `<article class="cart-row" data-cart-item="${escapeText(item.id)}"><img src="${escapeText(item.image)}" alt="" loading="lazy"><div><h3>${escapeText(item.name)}</h3><p>${money(item.price)} each</p><div class="cart-controls"><button type="button" data-action="minus" aria-label="Decrease quantity">−</button><input type="number" min="1" step="1" value="${Math.max(1, Number(item.quantity) || 1)}" data-quantity aria-label="Quantity for ${escapeText(item.name)}"><button type="button" data-action="plus" aria-label="Increase quantity">+</button><button type="button" class="cart-remove" data-action="remove">Remove</button></div></div><strong class="cart-row-total">${money((Number(item.price)||0)*(Number(item.quantity)||0))}</strong></article>`).join('');
  };
  list.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]'); if (!button) return;
    const row = button.closest('[data-cart-item]'); const item = cart.find(entry => entry.id === row?.dataset.cartItem); if (!item) return;
    if (button.dataset.action === 'plus') item.quantity = (Number(item.quantity)||1)+1;
    if (button.dataset.action === 'minus') item.quantity = Math.max(1,(Number(item.quantity)||1)-1);
    if (button.dataset.action === 'remove') cart = cart.filter(entry => entry.id !== item.id);
    save(); render();
  });
  list.addEventListener('change', event => {
    const input = event.target.closest('input[data-quantity]'); if (!input) return;
    const row = input.closest('[data-cart-item]'); const item = cart.find(entry => entry.id === row?.dataset.cartItem); if (!item) return;
    item.quantity = Math.max(1,Math.floor(Number(input.value)||1)); save(); render();
  });
  window.addEventListener('storage', event => { if (event.key === storageKey) { try { cart = JSON.parse(event.newValue || '[]') || []; } catch { cart = []; } render(); } });
  render();
})();
</script>
