<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Cart | All Area Shop</title>
    <style>
      :root {
        --ink: #28241f;
        --muted: #777168;
        --navy: #35445b;
        --line: #e8e3da;
        --paper: #f7f5f0;
        --card: #fffdfa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 Arial,
          sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px clamp(20px, 5vw, 72px);
        border-bottom: 1px solid #41392f19;
        background: #fffdfae0;
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--navy);
        text-decoration: none;
        font:
          28px Georgia,
          serif;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: white;
        color: var(--navy);
        font:
          bold 13px/1 Georgia,
          serif;
      }
      .back {
        color: var(--navy);
        font-weight: 700;
        text-decoration: none;
      }
      .mini-nav {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mini-nav a {
        white-space: nowrap;
      }
      .mini-nav a {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--navy);
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
      }
      .mini-nav svg {
        width: 15px;
        height: 15px;
      }
      .mini-avatar {
        width: 24px;
        height: 24px;
        border: 1px solid #fff;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 2px 8px #26354b22;
      }
      .mini-avatar[hidden] {
        display: none;
      }
      .page {
        width: min(1040px, 100%);
        min-height: 75vh;
        margin: auto;
        padding: clamp(48px, 7vw, 82px) clamp(20px, 5vw, 72px) 90px;
      }
      .eyebrow {
        color: #a9533d;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      h1 {
        margin: 12px 0;
        color: var(--ink);
        font:
          500 clamp(36px, 5vw, 56px)/1.05 Georgia,
          serif;
        letter-spacing: -0.04em;
      }
      .intro {
        margin: 0 0 30px;
        color: var(--muted);
      }
      .card {
        max-width: 760px;
        padding: clamp(22px, 4vw, 38px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 8px 24px #25221c0d;
      }
      .identity {
        display: flex;
        align-items: flex-start;
        gap: 22px;
      }
      .avatar {
        width: 112px;
        height: 112px;
        flex: none;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 5px 18px #242d3c26;
      }
      .avatar[hidden] {
        display: none;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        flex: 1;
      }
      .field {
        padding: 15px;
        border-radius: 10px;
        background: #f5f2ec;
        overflow-wrap: anywhere;
      }
      .field span {
        display: block;
        margin-bottom: 7px;
        color: #8b8174;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .field strong {
        color: var(--navy);
        font-size: 15px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      .actions a,
      .actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 17px;
        border: 0;
        border-radius: 9px;
        background: var(--navy);
        color: white;
        text-decoration: none;
        font:
          600 14px Arial,
          sans-serif;
        cursor: pointer;
      }
      .actions .secondary {
        background: #ebe7df;
        color: var(--navy);
      }
      .empty {
        padding: 26px;
        border: 1px dashed #d6cdc2;
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
      }
      footer {
        padding: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 620px) {
        .identity {
          flex-direction: column;
          align-items: center;
        }
        .fields {
          width: 100%;
          grid-template-columns: 1fr;
        }
        .brand {
          font-size: 24px;
        }
      }
      .mini-nav a {
        position: relative;
        perspective: 500px;
        transition:
          transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
          color 0.25s ease;
      }
      .mini-nav a svg,
      .mini-nav a img {
        transition:
          transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
          filter 0.3s ease;
      }
      .mini-nav a:focus-visible {
        outline: 2px solid #a96b4f;
        outline-offset: 4px;
        border-radius: 8px;
      }
      @media (hover: hover) {
        .mini-nav a:hover {
          transform: translateY(-2px) rotateX(4deg);
          color: #a9533d;
        }
        .mini-nav a:hover svg,
        .mini-nav a:hover img {
          transform: translateZ(7px) scale(1.1);
          filter: drop-shadow(0 3px 3px rgba(38, 49, 65, 0.2));
        }
        .mini-nav a:active {
          transform: translateY(0) scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mini-nav a,
        .mini-nav a svg,
        .mini-nav a img {
          transition: none !important;
          transform: none !important;
        }
      }
      /* Match the warm taupe glass navbar palette */
      .topbar {
        background: rgba(184, 160, 149, 0.9);
        border-bottom-color: rgba(82, 62, 52, 0.16);
        box-shadow: 0 8px 24px rgba(77, 57, 48, 0.12);
      }
      .brand,
      .mini-nav a {
        color: #493831;
      }
      .mini-nav a:hover {
        color: #754e3d;
      }
      .mark {
        color: #493831;
        background: rgba(255, 253, 250, 0.88);
        box-shadow: 0 4px 14px rgba(77, 57, 48, 0.12);
      }
      .mark {
        background: rgba(184, 160, 149, 0.88);
        box-shadow: 0 3px 12px rgba(77, 57, 48, 0.16);
      }
      .topbar {
        background: rgba(184, 160, 149, 0.9);
      }
      /* Match the shop's premium espresso and ivory glass navbar */
      .topbar {
        background: rgba(48, 40, 36, 0.94);
        border-bottom-color: rgba(238, 213, 190, 0.22);
        box-shadow: 0 10px 28px rgba(34, 27, 23, 0.2);
      }
      .brand,
      .mini-nav a {
        color: #fff4e8;
      }
      .brand:hover,
      .mini-nav a:hover {
        color: #e2bd91;
      }
      .mark {
        background: rgba(250, 240, 229, 0.94);
        color: #46342a;
        box-shadow: 0 3px 14px rgba(20, 16, 14, 0.2);
      }
      .mini-nav a:focus-visible {
        outline-color: #e2bd91;
      }
      /* Keep profile navbar interaction flat: 2D feedback only */
      .mini-nav a {
        perspective: none !important;
      }
      .mini-nav a:hover {
        transform: translateY(-1px) !important;
      }
      .mini-nav a:hover svg,
      .mini-nav a:hover img {
        transform: scale(1.06) !important;
      }
      .mini-nav a:active {
        transform: scale(0.98) !important;
      }
      /* Preserve navbar colors during hover and click */
      .mini-nav a:hover,
      .mini-nav a:focus-visible,
      .mini-nav a:active {
        color: #fff4e8 !important;
      }
      .mini-nav #nav-user {
        display: none !important;
      }

<style id="cart-motion">
:root{--e:cubic-bezier(.2,.75,.2,1);--o:cubic-bezier(.3,1.5,.4,1)}
body{background:radial-gradient(ellipse at 12% 6%,rgba(205,181,154,.38),transparent 42%),radial-gradient(ellipse at 92% 88%,rgba(150,120,95,.2),transparent 42%),#f7f3ec;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;pointer-events:none;animation:orb 18s ease-in-out infinite alternate}

.cart-page h1{margin:12px 0 6px;font:500 clamp(34px,6vw,56px)/1.04 Georgia,serif;letter-spacing:-.04em;color:#35445b;animation:wipe 1s var(--e) .1s both}

/* item cards */
.cart-row{position:relative;gap:15px;padding:15px;border-radius:18px;border-color:#eadfd3;background:linear-gradient(180deg,#fffefb,#fbf6ef);box-shadow:0 6px 18px rgba(80,58,42,.07);transition:transform .35s var(--e),box-shadow .35s,border-color .35s}

@keyframes row-out{to{opacity:0;transform:translateX(70px) scale(.92) rotate(2deg)}}

.cart-controls button:hover{border-color:#cfae8c;background:#f6ebdf}

.cart-controls input::-webkit-inner-spin-button{appearance:none}.cart-controls input{-moz-appearance:textfield}
.cart-controls [data-action=remove]{padding:0 12px;border-color:transparent;background:transparent;color:#a0583f}

/* summary */
.cart-summary{border:0;border-radius:20px;background:linear-gradient(#fffdf9,#fffdf9) padding-box,conic-gradient(from var(--a,0deg),#efe2d2,#d6ad7c,#efe2d2 40%,#efe2d2) border-box;border:1.5px solid transparent;box-shadow:0 20px 48px rgba(80,58,42,.14);animation:rise .8s var(--e) .35s both,spin 8s linear infinite}

.cart-summary strong.bump{animation:bump .55s var(--o)}
@keyframes bump{35%{transform:scale(1.25);color:#a0583f}}
.cart-summary strong{display:inline-block;transform-origin:100% 50%}
.cart-summary .continue-shopping{position:relative;overflow:hidden;background:linear-gradient(110deg,#59483f 0 40%,#8d6a43 50%,#59483f 60%) 100% 0/260% 100%;transition:background-position .7s,transform .25s,box-shadow .25s}

@keyframes cart-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

</style>

(() => {
 const key='all-area-shop-cart-v1', host=document.getElementById('cart-items');
 let cart=[]; try{cart=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(cart))cart=[]}catch{}
 const money=n=>`₹${Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`;
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(cart))}catch{};render()};
 const render=()=>{const count=cart.reduce((s,i)=>s+(Number(i.quantity)||1),0),subtotal=cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.quantity||1),0);document.getElementById('cart-summary-count').textContent=count;document.getElementById('cart-subtotal').textContent=money(subtotal);host.innerHTML=cart.length?cart.map((item,index)=>`<article class="cart-row"><img src="${item.image||''}" alt="" width="72"><div><h2>${item.name||'Product'}</h2><p>${money(item.price)} each</p><div class="cart-controls"><button type="button" data-action="minus" data-index="${index}">−</button><input type="number" min="1" value="${Math.max(1,Number(item.quantity)||1)}" data-action="quantity" data-index="${index}" aria-label="Quantity"><button type="button" data-action="plus" data-index="${index}">+</button><button type="button" data-action="remove" data-index="${index}">Remove</button></div></div><strong>${money(Number(item.price||0)*Number(item.quantity||1))}</strong></article>`).join(''):'<p class="cart-empty">Your cart is empty. Add products from the shop.</p>'};
 host.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const i=Number(button.dataset.index);if(button.dataset.action==='remove')cart.splice(i,1);if(button.dataset.action==='plus')cart[i].quantity=(Number(cart[i].quantity)||1)+1;if(button.dataset.action==='minus')cart[i].quantity=Math.max(1,(Number(cart[i].quantity)||1)-1);save()});
 host.addEventListener('change',event=>{const input=event.target.closest('input[data-action="quantity"]');if(!input)return;cart[Number(input.dataset.index)].quantity=Math.max(1,Math.floor(Number(input.value)||1));save()});host.classList.add('enter');render();setTimeout(()=>host.classList.remove('enter'),1600);
})();
</script>
      
<script>
(() => {
  const host=document.getElementById('cart-items'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const index=()=>[...host.children].forEach((r,i)=>r.style.setProperty('--i',i));
  index(); new MutationObserver(index).observe(host,{childList:true});
  /* pulse the totals when they change */
  ['cart-subtotal','cart-summary-count'].forEach(id=>{
    const el=document.getElementById(id); let first=true;
    new MutationObserver(()=>{ if(first){first=false;return} el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump') })
      .observe(el,{childList:true,characterData:true,subtree:true});
  });
  /* slide a row away before it is removed */
  host.addEventListener('click',e=>{
    const b=e.target.closest('button[data-action="remove"]'); if(!b||reduce) return;
    const row=b.closest('.cart-row'); if(!row||row.dataset.gone) return;
    e.stopPropagation(); row.dataset.gone=1; row.classList.add('leaving');
    setTimeout(()=>b.click(),380);
  },true);
})();
</script>
</body>
</html>
