<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4eee7">
  <title>Your Profile | All Area Shop</title>
  <style>
    :root{--ink:#302923;--muted:#777067;--accent:#77563d;--line:#e8dfd5;--paper:#f5f0e9;--card:#fffdf9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 4%,#e4d6c8 0,transparent 34%),radial-gradient(ellipse at 92% 95%,#d9dfd7 0,transparent 35%),var(--paper);color:var(--ink);font:15px/1.55 Arial,sans-serif}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px clamp(18px,5vw,68px);border-bottom:1px solid #49372a1a;background:#fffdf9d9;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:10px;color:#344250;text-decoration:none;font:26px Georgia,serif}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#fff;color:#77563d;font:bold 14px Georgia,serif;box-shadow:0 3px 12px #392b2014}
    .back{color:#59483f;font-weight:700;text-decoration:none}.back:hover,.actions a:hover{text-decoration:underline;text-underline-offset:3px}
    main{width:min(850px,100%);margin:0 auto;padding:clamp(42px,8vw,78px) 20px 68px}
    .eyebrow{margin:0;color:#a05f43;font-size:11px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
    h1{margin:10px 0 8px;font:500 clamp(38px,7vw,58px)/1.02 Georgia,serif;letter-spacing:-.045em}
    .intro{margin:0 0 25px;color:var(--muted)}
    .card{padding:clamp(22px,5vw,38px);border:1px solid #fff;border-radius:20px;background:#fffdf9e8;box-shadow:0 20px 58px #38291c16,inset 0 1px #fff;backdrop-filter:blur(14px)}
    .empty{padding:22px;border:1px dashed #d9cfc4;border-radius:13px;color:var(--muted);text-align:center}.empty a{color:var(--accent);font-weight:700}
    .identity{display:flex;align-items:flex-start;gap:24px}.avatar{width:104px;height:104px;flex:none;border:4px solid white;border-radius:50%;object-fit:cover;box-shadow:0 5px 20px #392b2022}.avatar[hidden]{display:none}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}.field{min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#f8f4ee}.field span{display:block;margin-bottom:4px;color:#877c70;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.field strong{display:block;overflow-wrap:anywhere;font-size:14px;font-weight:600}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}.actions a,.actions button{min-height:43px;padding:10px 16px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:#fffaf4;font:700 13px Arial,sans-serif;text-decoration:none;cursor:pointer}.actions .secondary{border-color:#ded3c8;background:#f7f2ed;color:#59483f}.actions a:hover,.actions button:hover{filter:brightness(1.08)}
    footer{padding:18px;text-align:center;color:#847b72;font-size:12px}
    [hidden]{display:none!important}
    @media(max-width:600px){.topbar{padding:13px 16px}.brand{font-size:21px}.brand .mark{width:32px;height:32px}.back{font-size:12px}main{padding-top:38px}.identity{flex-direction:column;align-items:center;gap:16px}.fields{grid-template-columns:1fr}.avatar{width:88px;height:88px}.field{padding:11px 13px}.actions>*{flex:1;text-align:center}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="AA_shop_responsive_media_queries.html"><span class="mark">AA</span> All Area Shop</a>
    <a class="back" href="AA_shop_responsive_media_queries.html">← Back to the shop</a>
  </header>
  <main>
    <p class="eyebrow">Your account</p>
    <h1>Profile</h1>
    <p class="intro" id="message">Your saved account details appear here.</p>
    <section class="card">
      <div id="signed-out" class="empty" hidden>You are not logged in yet. <a href="Frontend%20login.html">Log in to your account</a> to view your profile.</div>
      <div id="signed-in" hidden>
        <div class="identity">
          <img class="avatar" id="photo" alt="Profile photo" hidden>
          <div class="fields">
            <div class="field"><span>Name</span><strong id="name"></strong></div>
            <div class="field"><span>Phone</span><strong id="phone"></strong></div>
            <div class="field"><span>Email</span><strong id="email"></strong></div>
          </div>
        </div>
        <div class="actions">
          <a href="Frontend%20login.html?edit=1">Edit details</a>
          <button type="button" class="secondary" id="logout">Log out</button>
        </div>
      </div>
    </section>
  </main>
  <footer>All Area Shop · Thoughtful finds for every corner.</footer>
  <script>
   
    (() => {
      const localKey = 'allAreaShopProfile';
      const byId = id => document.getElementById(id);
      const fromHash = () => {
        const match = location.hash.match(/^#profile\?(.*)$/);
        if (!match) return null;
        const params = new URLSearchParams(match[1]);
        return {name:params.get('name')||'',phone:params.get('phone')||'',email:params.get('email')||'',photo:params.get('photo')||''};
      };
      const render = profile => {
        byId('signed-out').hidden = Boolean(profile);
        byId('signed-in').hidden = !profile;
        byId('message').textContent = profile ? 'Your details are saved securely to your account.' : 'Sign in to view your saved account details.';
        if (!profile) { byId('photo').hidden = true; return; }
        for (const field of ['name','phone','email']) byId(field).textContent = profile[field] || '';
        const photo = profile.photo || '';
        byId('photo').hidden = !photo;
        if (photo) byId('photo').src = photo;
        try { localStorage.setItem(localKey, JSON.stringify(profile)); } catch {}
      };
      const load = async () => {
        const handoff = fromHash();
        if (handoff) {
          try { localStorage.setItem(localKey, JSON.stringify(handoff)); } catch {}
          history.replaceState(null, '', location.pathname + location.search);
        }
        try {
          const response = await fetch('/api/profile', {headers:{Accept:'application/json'}});
          if (response.ok) { const data = await response.json(); render(data.profile); return; }
        } catch {}
        let saved = handoff;
        try { saved = saved || JSON.parse(localStorage.getItem(localKey) || 'null'); } catch {}
        render(saved);
      };
      byId('logout').addEventListener('click', async () => {
        try { await fetch('/api/auth/logout', {method:'POST'}); } catch {}
        try { localStorage.removeItem(localKey); } catch {}
        render(null);
      });
      load();
    })();
  </script>
</body>
</html>
